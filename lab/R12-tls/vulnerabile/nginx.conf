events {}
http {
    server {
        listen 443 ssl;
        server_name target;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers DEFAULT@SECLEVEL=0;
        ssl_conf_command MinProtocol TLSv1;

        location / {
            return 200 "OK\n";
        }
    }
}
