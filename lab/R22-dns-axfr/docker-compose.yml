services:
  target-vulnerabile:
    build: .
    profiles: ["vulnerabile"]
    volumes:
      - ./vulnerabile/named.conf:/etc/bind/named.conf:ro
    command: ["named", "-g", "-u", "bind", "-c", "/etc/bind/named.conf"]
    networks:
      lab-net:
        aliases:
          - target

  target-corretto:
    build: .
    profiles: ["corretto"]
    volumes:
      - ./corretto/named.conf:/etc/bind/named.conf:ro
    command: ["named", "-g", "-u", "bind", "-c", "/etc/bind/named.conf"]
    networks:
      lab-net:
        aliases:
          - target

  attacker:
    build: .
    profiles: ["vulnerabile", "corretto"]
    entrypoint: ["sleep", "infinity"]
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
