services:
  target-vulnerabile:
    build: .
    profiles: ["vulnerabile"]
    volumes:
      - ./vulnerabile/inetd.conf:/etc/inetd.conf:ro
    command: ["sh", "-c", "/usr/sbin/sshd && /usr/sbin/inetutils-inetd -d /etc/inetd.conf"]
    networks:
      lab-net:
        aliases:
          - target

  target-corretto:
    build: .
    profiles: ["corretto"]
    volumes:
      - ./corretto/inetd.conf:/etc/inetd.conf:ro
    command: ["sh", "-c", "/usr/sbin/sshd && /usr/sbin/inetutils-inetd -d /etc/inetd.conf"]
    networks:
      lab-net:
        aliases:
          - target

  attacker:
    build: .
    profiles: ["vulnerabile", "corretto"]
    entrypoint: ["sleep", "infinity"]
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
