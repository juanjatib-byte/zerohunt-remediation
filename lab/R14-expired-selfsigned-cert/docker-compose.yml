services:
  target-vulnerabile:
    build: ./vulnerabile
    profiles: ["vulnerabile"]
    networks:
      lab_net:
        aliases: [target]
  target-corretto:
    build:
      context: .
      dockerfile: corretto/Dockerfile
    profiles: ["corretto"]
    networks:
      lab_net:
        aliases: [target]
  attacker:
    image: alpine:latest
    profiles: ["vulnerabile", "corretto"]
    volumes:
      - ./certs/ca.crt:/usr/local/share/ca-certificates/corp-ca.crt:ro
    command: sh -c "apk add --no-cache curl ca-certificates && update-ca-certificates && tail -f /dev/null"
    networks: [lab_net]
networks:
  lab_net:
