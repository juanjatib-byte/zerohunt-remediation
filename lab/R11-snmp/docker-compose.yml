services:
  target-vulnerabile:
    build: .
    profiles: ["vulnerabile"]
    volumes:
      - ./vulnerabile/snmpd.conf:/etc/snmp/snmpd.conf:ro
    command: ["snmpd", "-f", "-Lo", "-C", "-c", "/etc/snmp/snmpd.conf"]
    networks:
      lab-net:
        aliases:
          - target

  target-corretto:
    build: .
    profiles: ["corretto"]
    volumes:
      - ./corretto/snmpd.conf:/etc/snmp/snmpd.conf:ro
    command: ["snmpd", "-f", "-Lo", "-C", "-c", "/etc/snmp/snmpd.conf"]
    networks:
      lab-net:
        aliases:
          - target

  attacker:
    build: .
    profiles: ["vulnerabile", "corretto"]
    entrypoint: ["sleep", "infinity"]
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
